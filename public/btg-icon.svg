<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="appClip">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
    <radialGradient id="ibg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0F2040"/>
      <stop offset="55%" stop-color="#080F1C"/>
      <stop offset="100%" stop-color="#020407"/>
    </radialGradient>
    <linearGradient id="igold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE08A"/>
      <stop offset="30%" stop-color="#D4A940"/>
      <stop offset="70%" stop-color="#C49A2E"/>
      <stop offset="100%" stop-color="#8A6818"/>
    </linearGradient>
    <linearGradient id="igoldH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A6818"/>
      <stop offset="30%" stop-color="#D4A940"/>
      <stop offset="50%" stop-color="#FFE08A"/>
      <stop offset="70%" stop-color="#D4A940"/>
      <stop offset="100%" stop-color="#8A6818"/>
    </linearGradient>
    <radialGradient id="iwL" cx="35%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#205590"/>
      <stop offset="50%" stop-color="#0D3060"/>
      <stop offset="100%" stop-color="#050F22"/>
    </radialGradient>
    <radialGradient id="iwR" cx="65%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#553818"/>
      <stop offset="50%" stop-color="#302008"/>
      <stop offset="100%" stop-color="#0E0802"/>
    </radialGradient>
    <radialGradient id="iatL" cx="50%" cy="50%" r="50%">
      <stop offset="62%" stop-color="#0D3060" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1A80D0" stop-opacity="0.32"/>
    </radialGradient>
    <radialGradient id="iatR" cx="50%" cy="50%" r="50%">
      <stop offset="62%" stop-color="#302008" stop-opacity="0"/>
      <stop offset="100%" stop-color="#D4A940" stop-opacity="0.28"/>
    </radialGradient>
    <radialGradient id="iheartR" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#FFE8A0"/>
      <stop offset="45%" stop-color="#D4A940"/>
      <stop offset="100%" stop-color="#8A6818"/>
    </radialGradient>
    <linearGradient id="iskin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A4828"/>
      <stop offset="45%" stop-color="#C07848"/>
      <stop offset="100%" stop-color="#6A3C1C"/>
    </linearGradient>
    <linearGradient id="icable" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE08A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8A6818" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="iglow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="isglow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ihglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="iwglow" x="-18%" y="-18%" width="136%" height="136%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#appClip)">

    <!-- BACKGROUND -->
    <rect width="1024" height="1024" fill="url(#ibg)"/>

    <!-- Ambient center light -->
    <ellipse cx="512" cy="490" rx="350" ry="280" fill="#D4A940" opacity="0.038"/>

    <!-- Stars - sparse, premium -->
    <circle cx="95" cy="80" r="1.8" fill="#FFE08A" opacity="0.52"/>
    <circle cx="240" cy="58" r="1.1" fill="white" opacity="0.32"/>
    <circle cx="420" cy="42" r="2" fill="#FFE08A" opacity="0.48"/>
    <circle cx="608" cy="66" r="1.3" fill="white" opacity="0.26"/>
    <circle cx="778" cy="50" r="1.7" fill="#FFE08A" opacity="0.56"/>
    <circle cx="930" cy="80" r="1.2" fill="white" opacity="0.36"/>
    <circle cx="60" cy="175" r="1.1" fill="white" opacity="0.22"/>
    <circle cx="960" cy="162" r="1.5" fill="#FFE08A" opacity="0.4"/>
    <circle cx="130" cy="290" r="0.9" fill="white" opacity="0.18"/>
    <circle cx="892" cy="278" r="1.3" fill="#FFE08A" opacity="0.32"/>
    <circle cx="512" cy="30" r="1.5" fill="white" opacity="0.28"/>

    <!-- ── LEFT WORLD (larger, more prominent) ── -->
    <circle cx="178" cy="490" r="188" fill="url(#iatL)"/>
    <circle cx="178" cy="490" r="155" fill="url(#iwL)" filter="url(#iwglow)"/>
    <!-- Specular -->
    <ellipse cx="140" cy="432" rx="46" ry="33" fill="white" opacity="0.052" transform="rotate(-22,140,432)"/>
    <!-- Landmass -->
    <path d="M148 450 Q164 428 192 440 Q212 452 210 482 Q207 506 188 520 Q168 530 150 518 Q132 504 140 480 Q146 458 148 450Z" fill="#1E6CA8" opacity="0.7"/>
    <path d="M192 454 Q208 442 222 454 Q231 466 224 486 Q214 500 200 496 Q186 488 190 470Z" fill="#175E92" opacity="0.58"/>
    <path d="M132 478 Q148 472 164 478" stroke="#2A8CD4" stroke-width="1.3" fill="none" opacity="0.35"/>
    <path d="M128 496 Q144 490 160 496" stroke="#2A8CD4" stroke-width="1" fill="none" opacity="0.25"/>
    <circle cx="178" cy="490" r="155" fill="none" stroke="#2060A0" stroke-width="1.8" opacity="0.22"/>

    <!-- ── RIGHT WORLD ── -->
    <circle cx="846" cy="490" r="188" fill="url(#iatR)"/>
    <circle cx="846" cy="490" r="155" fill="url(#iwR)" filter="url(#iwglow)"/>
    <ellipse cx="810" cy="436" rx="44" ry="30" fill="white" opacity="0.044" transform="rotate(-18,810,436)"/>
    <path d="M814 446 Q832 424 860 438 Q880 452 876 480 Q872 506 854 520 Q832 530 816 518 Q798 502 806 478 Q813 454 814 446Z" fill="#7A5820" opacity="0.76"/>
    <path d="M858 450 Q876 438 892 452 Q900 466 892 488 Q880 502 864 498 Q848 490 852 472Z" fill="#6A4C18" opacity="0.65"/>
    <path d="M826 516 Q840 508 854 516 Q860 526 852 534 Q840 538 828 532Z" fill="#8A6428" opacity="0.5"/>
    <circle cx="846" cy="490" r="155" fill="none" stroke="#9A7820" stroke-width="1.8" opacity="0.18"/>

    <!-- ── THE BRIDGE ── -->

    <!-- Ground shadow -->
    <path d="M316 645 Q512 600 708 645" stroke="#020507" stroke-width="28" fill="none" stroke-linecap="round" opacity="0.8"/>

    <!-- Deck -->
    <path d="M312 638 Q512 594 712 638" stroke="url(#igoldH)" stroke-width="22" fill="none" stroke-linecap="round" filter="url(#isglow)"/>
    <path d="M318 641 Q512 598 706 641" stroke="#6A4C10" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.4"/>
    <path d="M316 634 Q512 590 708 634" stroke="#FFE08A" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.42"/>

    <!-- Main arch -->
    <path d="M310 636 Q512 320 714 636" stroke="url(#igold)" stroke-width="14" fill="none" stroke-linecap="round" filter="url(#isglow)"/>
    <path d="M320 632 Q512 340 704 632" stroke="#FFE08A" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.35"/>

    <!-- Suspension cables -->
    <line x1="348" y1="562" x2="348" y2="636" stroke="url(#icable)" stroke-width="2.4" opacity="0.8"/>
    <line x1="384" y1="518" x2="384" y2="634" stroke="url(#icable)" stroke-width="2.4" opacity="0.8"/>
    <line x1="422" y1="488" x2="422" y2="631" stroke="url(#icable)" stroke-width="2.4" opacity="0.8"/>
    <line x1="460" y1="466" x2="460" y2="628" stroke="url(#icable)" stroke-width="2.4" opacity="0.8"/>
    <line x1="488" y1="456" x2="488" y2="626" stroke="url(#icable)" stroke-width="2.4" opacity="0.8"/>
    <line x1="512" y1="452" x2="512" y2="624" stroke="url(#icable)" stroke-width="2.4" opacity="0.8"/>
    <line x1="536" y1="456" x2="536" y2="626" stroke="url(#icable)" stroke-width="2.4" opacity="0.8"/>
    <line x1="564" y1="466" x2="564" y2="628" stroke="url(#icable)" stroke-width="2.4" opacity="0.8"/>
    <line x1="602" y1="488" x2="602" y2="631" stroke="url(#icable)" stroke-width="2.4" opacity="0.8"/>
    <line x1="640" y1="518" x2="640" y2="634" stroke="url(#icable)" stroke-width="2.4" opacity="0.8"/>
    <line x1="676" y1="562" x2="676" y2="636" stroke="url(#icable)" stroke-width="2.4" opacity="0.8"/>

    <!-- Left Tower -->
    <rect x="370" y="462" width="19" height="182" rx="4" fill="url(#igold)" filter="url(#isglow)"/>
    <rect x="362" y="452" width="35" height="15" rx="4.5" fill="#FFE08A"/>
    <rect x="360" y="449" width="39" height="6" rx="3" fill="#FFF0B0" opacity="0.65"/>
    <rect x="361" y="596" width="37" height="9" rx="2.5" fill="#C49A2E" opacity="0.82"/>
    <rect x="370" y="462" width="6" height="182" rx="2" fill="#FFE8A0" opacity="0.22"/>

    <!-- Right Tower -->
    <rect x="635" y="462" width="19" height="182" rx="4" fill="url(#igold)" filter="url(#isglow)"/>
    <rect x="627" y="452" width="35" height="15" rx="4.5" fill="#FFE08A"/>
    <rect x="625" y="449" width="39" height="6" rx="3" fill="#FFF0B0" opacity="0.65"/>
    <rect x="626" y="596" width="37" height="9" rx="2.5" fill="#C49A2E" opacity="0.82"/>
    <rect x="635" y="462" width="6" height="182" rx="2" fill="#FFE8A0" opacity="0.22"/>

    <!-- ── HANDS ── -->
    <!-- Left hand reaching right -->
    <g opacity="0.92">
      <path d="M280 622 Q345 604 418 607 Q428 610 426 622 Q424 633 412 634 Q345 634 280 637Z" fill="#6A3C1C"/>
      <ellipse cx="436" cy="610" rx="32" ry="18" fill="#9C5C30" transform="rotate(-9,436,610)"/>
      <path d="M447 593 Q476 580 489 587 Q495 591 488 598 Q474 594 452 602Z" fill="#B87048"/>
      <path d="M445 600 Q472 589 484 597 Q489 602 482 608 Q469 604 449 610Z" fill="#A86038"/>
      <path d="M443 607 Q468 598 479 606 Q483 613 476 617 Q464 613 446 617Z" fill="#B87048"/>
      <path d="M440 614 Q462 607 471 614 Q475 620 468 624 Q458 622 442 622Z" fill="#A06030"/>
      <path d="M424 600 Q434 587 447 592 Q453 597 448 604 Q438 606 426 609Z" fill="#9C5C30"/>
    </g>

    <!-- Right hand reaching left -->
    <g opacity="0.92">
      <path d="M744 622 Q679 604 606 607 Q596 610 598 622 Q600 633 612 634 Q679 634 744 637Z" fill="#6A3C1C"/>
      <ellipse cx="588" cy="610" rx="32" ry="18" fill="#9C5C30" transform="rotate(9,588,610)"/>
      <path d="M577 593 Q548 580 535 587 Q529 591 536 598 Q550 594 572 602Z" fill="#B87048"/>
      <path d="M579 600 Q552 589 540 597 Q535 602 542 608 Q555 604 575 610Z" fill="#A86038"/>
      <path d="M581 607 Q556 598 545 606 Q541 613 548 617 Q560 613 578 617Z" fill="#B87048"/>
      <path d="M584 614 Q562 607 553 614 Q549 620 556 624 Q566 622 582 622Z" fill="#A06030"/>
      <path d="M600 600 Q590 587 577 592 Q571 597 576 604 Q586 606 598 609Z" fill="#9C5C30"/>
    </g>

    <!-- ── HEART ── -->
    <!-- Deep glow -->
    <path d="M512 398 C512 398 462 360 440 382 C418 404 440 436 512 475 C584 436 606 404 584 382 C562 360 512 398 512 398Z" fill="#D4A940" opacity="0.16" filter="url(#ihglow)"/>
    <!-- Mid glow -->
    <path d="M512 404 C512 404 466 370 446 390 C426 410 446 440 512 476 C578 440 598 410 578 390 C558 370 512 404 512 404Z" fill="#D4A940" opacity="0.22" filter="url(#isglow)"/>
    <!-- Main heart shape -->
    <path d="M512 412 C512 412 470 380 452 400 C434 420 452 448 512 482 C572 448 590 420 572 400 C554 380 512 412 512 412Z" fill="url(#iheartR)" filter="url(#isglow)"/>
    <!-- Highlight -->
    <path d="M490 400 C497 390 512 393 514 401" stroke="white" stroke-width="2.5" fill="none" opacity="0.3" stroke-linecap="round"/>
    <!-- Base shadow -->
    <path d="M466 444 Q488 462 512 472 Q536 462 558 444" stroke="#8A6818" stroke-width="1.5" fill="none" opacity="0.28"/>

    <!-- ── SPARKLES ── -->
    <g fill="#FFE08A" filter="url(#isglow)">
      <path d="M440 366 L443 353 L446 366 L459 369 L446 372 L443 385 L440 372 L427 369Z" opacity="0.84"/>
      <path d="M578 360 L581 348 L584 360 L596 363 L584 366 L581 378 L578 366 L566 363Z" opacity="0.76"/>
      <path d="M422 400 L424 393 L426 400 L433 401.5 L426 403 L424 410 L422 403 L415 401.5Z" opacity="0.62"/>
      <path d="M600 394 L602 387 L604 394 L611 395.5 L604 397 L602 404 L600 397 L593 395.5Z" opacity="0.62"/>
      <circle cx="458" cy="352" r="2.8" opacity="0.48"/>
      <circle cx="566" cy="348" r="2.3" opacity="0.43"/>
    </g>

    <!-- ── BORDER ── -->
    <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"
      fill="none" stroke="url(#igold)" stroke-width="6" opacity="0.3"/>
    <rect x="11" y="11" width="1002" height="1002" rx="215" ry="215"
      fill="none" stroke="#D4A940" stroke-width="1.5" opacity="0.13"/>

  </g>
</svg>
